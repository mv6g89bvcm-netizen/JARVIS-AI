
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#030914">
<title>J.A.R.V.I.S.</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background:
    radial-gradient(ellipse at 50% 35%, #09264a 0%, #030914 55%, #01040a 100%);
  color: #d8f5ff;
  font-family: Arial, "Noto Sans JP", sans-serif;
  min-height: 100vh;
  padding: 16px 14px 25px;
  overflow-x: hidden;
}

.app {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1c6685;
  padding: 10px 2px 15px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 4px;
  color: #a9edff;
  text-shadow: 0 0 15px #00bfff;
}

.status {
  font-size: 9px;
  letter-spacing: 2px;
  color: #56e6c1;
}

.status::before {
  content: "● ";
  color: #40ffc2;
}

.clock {
  text-align: right;
  font-size: 11px;
  color: #7caec8;
  margin-top: 5px;
}

.panel {
  border: 1px solid #176083;
  background: linear-gradient(135deg, #0b2035cc, #06101ddd);
  border-radius: 12px;
  padding: 13px;
  box-shadow: 0 0 16px #008ac522;
}

.panel-title {
  color: #62dfff;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.dashboard {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 17px;
}

.panel p {
  font-size: 12px;
  line-height: 1.9;
  color: #c5dce8;
}

.reactor-area {
  text-align: center;
  padding: 25px 0 22px;
}

.reactor {
  width: 190px;
  height: 190px;
  margin: auto;
  border-radius: 50%;
  border: 2px solid #3acbff;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow:
    0 0 15px #00aaff,
    inset 0 0 25px #008cff55,
    0 0 60px #007bff55;
  animation: pulse 3s infinite ease-in-out;
}

.reactor::before,
.reactor::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid #42dfff88;
}

.reactor::before {
  inset: 12px;
  border-style: dashed;
  animation: rotate 18s linear infinite;
}

.reactor::after {
  inset: 28px;
  border-width: 2px;
  border-color: #00aaff;
  box-shadow: 0 0 20px #00aaff;
}

.core {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: radial-gradient(circle, #e9ffff, #24cfff 35%, #005baf 75%);
  box-shadow: 0 0 35px #00bfff;
  z-index: 1;
}

@keyframes pulse {
  50% {
    transform: scale(1.035);
    box-shadow: 0 0 35px #00bfff,
      inset 0 0 35px #008cff88,
      0 0 80px #007bff77;
  }
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.reactor-label {
  margin-top: 18px;
  font-size: 10px;
  letter-spacing: 4px;
  color: #65dfff;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.action {
  background: #0b2942;
  border: 1px solid #1684ad;
  border-radius: 8px;
  color: #bcefff;
  padding: 13px 5px;
  font-size: 10px;
  letter-spacing: 1px;
}

.action:active {
  background: #15527a;
}

.response {
  margin-top: 15px;
  min-height: 85px;
}

.response-text {
  font-size: 14px;
  line-height: 1.8;
  color: #e3faff;
}

.input-area {
  display: flex;
  gap: 7px;
  margin-top: 12px;
}

input {
  min-width: 0;
  flex: 1;
  background: #071a2b;
  border: 1px solid #16739a;
  border-radius: 8px;
  padding: 13px 10px;
  color: white;
  font-size: 14px;
  outline: none;
}

button {
  cursor: pointer;
}

.send, .mic {
  background: #0876a5;
  border: 1px solid #48cfff;
  border-radius: 8px;
  color: white;
  padding: 0 14px;
  font-size: 12px;
}

footer {
  text-align: center;
  margin-top: 23px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #4b819e;
}

@media (max-width: 360px) {
  .reactor {
    width: 165px;
    height: 165px;
  }
}
</style>
</head>

<body>
<div class="app">

<header>
  <div>
    <div class="logo">J.A.R.V.I.S.</div>
    <div class="status">SYSTEM ONLINE</div>
  </div>
  <div class="clock" id="clock">--:--</div>
</header>

<div class="dashboard">

  <section class="panel">
    <div class="panel-title">TODAY'S SCHEDULE</div>
  <div id="schedule-list">
  <p>予定を読み込み中...</p>
</div>
  </section>

  <section class="panel">
    <div class="panel-title">WEATHER</div>
    <p>18°C　Cloudy</p>
    <p>Weather data unavailable</p>
  </section>

</div>

<section class="reactor-area">
  <div class="reactor">
    <div class="core"></div>
  </div>
  <div class="reactor-label">JARVIS CORE SYSTEM</div>
</section>

<div class="dashboard">

  <section class="panel">
    <div class="panel-title">REMINDERS</div>
    <p>No active reminders</p>
    <p>All systems ready</p>
  </section>

  <section class="panel">
    <div class="panel-title">QUICK ACTION</div>
    <div class="actions">
      <!-- JARVIS アラーム設定用ボタン＆モーダル -->
<button class="action" onclick="openAlarmModal()">ALARM</button>

<!-- 時刻選択モーダル（初期状態は非表示） -->
<div id="alarmModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #0b1329; border: 2px solid #00f0ff; padding: 25px; border-radius: 15px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 0 20px rgba(0,240,255,0.4);">
        <h3 style="color: #00f0ff; margin-bottom: 15px; font-family: monospace;">SET ALARM TIME</h3>
        <input type="time" id="alarmTimeInput" value="07:00" style="font-size: 24px; padding: 10px; background: #030712; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; width: 100%; text-align: center; margin-bottom: 20px;">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="setAlarm()" style="flex: 1; padding: 12px; background: #00f0ff; color: #030712; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;">SET ALARM</button>
            <button onclick="closeAlarmModal()" style="flex: 1; padding: 12px; background: transparent; color: #8a9bb8; border: 1px solid #8a9bb8; border-radius: 8px; cursor: pointer;">CANCEL</button>
        </div>
    </div>
</div>

<script>
function openAlarmModal() {
    document.getElementById('alarmModal').style.display = 'flex';
}
function closeAlarmModal() {
    document.getElementById('alarmModal').style.display = 'none';
}
function setAlarm() {
    const timeVal = document.getElementById('alarmTimeInput').value;
    if (!timeVal) return;
    // ショートカットへ時刻を渡して起動
    location.href = `shortcuts://run-shortcut?name=JARVIS%20-%20%E3%82%A2%E3%83%A9%E3%83%BC%E3%83%A0%E8%A8%AD%E5%AE%9A&input=text&text=${encodeURIComponent(timeVal)}`;
}
</script>

      <button class="action" onclick="demo('カレンダー機能は未接続です。')">CALENDAR</button>
      <button class="action" onclick="demo('リマインダー機能は未接続です。')">REMINDER</button>
      <button class="action" onclick="demo('Web検索機能は未接続です。')">WEB SEARCH</button>
    </div>
  </section>

</div>

<section class="panel response">
  <div class="panel-title">J.A.R.V.I.S. RESPONSE</div>
  <div class="response-text" id="answer">
    お待ちしております。
  </div>
</section>

<div class="input-area">
  <button class="mic" onclick="listen()">MIC</button>
  <input id="message" type="text" placeholder="メッセージを入力">
  <button class="send" onclick="send()">SEND</button>
</div>

<footer>
  PERSONAL AI ASSISTANT<br><br>
  VERSION 2.0
</footer>

</div>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleDateString("ja-JP") + "　" +
    now.toLocaleTimeString("ja-JP", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

setInterval(updateClock, 1000);
updateClock();

function demo(text) {
  document.getElementById("answer").textContent = text;
  speak(text);
}

function send() {
  const input = document.getElementById("message");
  const q = input.value.trim();

  if (!q) return;

  const reply = "入力を受け付けました。「" + q +
    "」現在、AIエンジンは未接続です。";

  document.getElementById("answer").textContent = reply;
  speak(reply);
  input.value = "";
}

function speak(text) {
  if (!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "ja-JP";
  utterance.rate = 0.95;

  speechSynthesis.speak(utterance);
}

function listen() {
  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    demo("このブラウザでは音声入力に対応していません。");
    return;
  }

  const recognition = new Recognition();
  recognition.lang = "ja-JP";
  recognition.interimResults = false;

  recognition.onresult = function(event) {
    document.getElementById("message").value =
      event.results[0][0].transcript;
    send();
  };

  recognition.onerror = function() {
    demo("音声入力を利用できませんでした。");
  };

  recognition.start();
}
</script>

</body>
</html>
